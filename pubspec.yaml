name: flutter_fitness
description: "Flutter Fitness - Lokaler Fitness Tracker"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  drift: ^2.23.1
  sqlite3_flutter_libs: ^0.5.28
  path_provider: ^2.1.5
  path: ^1.9.1
  intl: ^0.20.2
  uuid: ^4.5.1
  fl_chart: ^0.70.2
  share_plus: ^13.3.0
  file_picker: ^12.1.2
  vibration: ^3.2.0
  shared_preferences: ^2.5.5
  google_fonts: ^8.2.1
  flutter_launcher_icons: ^0.9.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.23.1
  build_runner: ^2.4.14

flutter:
  uses-material-design: true
  assets:
    - assets/exercises/
    - assets/exercises/exercises_meta.json

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/app_icon.png"
  adaptive_icon_background: "#121212"
  adaptive_icon_foreground: "assets/app_icon.png"
